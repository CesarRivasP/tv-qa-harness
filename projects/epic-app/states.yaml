# Method choice per state is decided by the live validation in this task:
#   a11y  — preferred; matches against the agent-device accessibility snapshot.
#           Resolution-independent: no re-calibration if the AVD changes density/size.
#   ocr   — fallback for screens with poor a11y trees. Boxes are
#           (left, top, right, bottom) in physical pixels at expected_resolution.
#   phash — image-perceptual-hash match (future).
#
# Calibration protocol:
#   1. Navigate to the screen on the emulator.
#   2. Run `tvqa snapshot` to inspect the a11y tree.
#   3. If the snapshot shows useful text nodes → method: a11y.
#   4. If the snapshot is empty/noisy → method: ocr (measure box in Preview/GIMP).
#   5. Write the state into this file and commit it so future agents never need to measure again.

states:
  # --- Authentication ---
  login_form:
    method: a11y
    expected_text: "Inicia sesión"

  profile_select:
    method: a11y
    expected_text: "Who is watching?"

  auth_error_modal:
    method: ocr
    box: [600, 400, 1320, 520]
    expected_substring: "expirado"

  # --- Home & Navigation ---
  home_screen_rail:
    method: a11y
    expected_text: "Top 10"

  search_screen:
    method: a11y
    # Language-dependent: "Titles, people" (EN) vs "Títulos, Personas" (ES)
    expected_text: "Titles, people"

  # --- VOD Player ---
  vod_player:
    method: ocr
    box: [80, 940, 500, 1000]
    expected_substring: ":"

  # --- Live TV ---
  live_tv_grid:
    method: a11y
    # Calibrated 2026-07-31 emulator-5554: the grid header "TV en vivo" is NOT in the
    # a11y tree; the stable live-only anchor is the country selector "Costa Rica".
    expected_text: "Costa Rica"

  channel_unavailable:
    method: ocr
    box: [700, 420, 1220, 480]
    expected_substring: "unavailable"

  # --- Settings ---
  settings_root:
    method: a11y
    expected_text: "Cuenta"

  # --- Network / Error ---
  network_error_modal:
    method: ocr
    box: [700, 430, 1220, 490]
    expected_substring: "Error de red"
