# #255 — Live 403/segment failure surfaces to onError fast
# Goal: live 403 recovers ~5s worst case (was ~15-30s).
# Harness: mitmproxy token403 mode, mid-playback expiry at 45s.
# Reference: e2e_test_suite.md §#255
name: tc255_live_403
description: "Live channel playback with injected token403; verify onError reaches JS and recovers cleanly."
steps:
  # Pre-flight: ensure clean
  - open_app: EpicTV
  - wait_state: home_screen_rail
    timeout: 20
  # Navigate to Live TV and start playback
  - keyevent: DPAD_RIGHT  # TODO(calibrate): reach Live TV
  - keyevent: DPAD_RIGHT
  - keyevent: DPAD_CENTER
  - sleep: 2
  - wait_state: live_tv_grid
    timeout: 15
  - keyevent: DPAD_CENTER
  - sleep: 5
  # Start mitmproxy with token403 (expires after 45s)
  - proxy: {mode: token403}
  - sleep: 50       # wait for expiry to inject 403
  # Stop proxy to allow recovery with fresh token
  - proxy_stop: {}
  # Wait for recovery indicator in logcat
  - wait_log: "playerFailed"
    timeout: 30
  # Verify still alive (not stuck on spinner)
  - wait_state: live_tv_grid
    timeout: 20
