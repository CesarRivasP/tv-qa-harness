# S5 — VOD next-episode
# Preconditions: logged in, any screen
# Steps: sidebar → Series → open series → play → trigger next-episode
name: s5_vod_next_episode
description: "Play a series episode and trigger next-episode; verify advances cleanly."
steps:
  # Sidebar → Series (from Home-focused sidebar, DOWN×3)
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 2
  # Navigate to a series row and open
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 2
  - wait_state: vod_player
    timeout: 15
  # Play episode
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Trigger next-episode (TODO: calibrate how next-episode UI appears)
  - keyevent: DPAD_RIGHT
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Should still be in player, not remounted to start
  - assert_state: vod_player
