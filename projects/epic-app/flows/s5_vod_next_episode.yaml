# S5 — VOD next-episode
# Preconditions: logged in, playing a series episode
# Steps: series title → play → trigger next-episode control → verify advances without remount-to-start
name: s5_vod_next_episode
description: "Play a series episode and trigger next-episode; verify advances cleanly."
steps:
  - wait_state: home_screen_rail
    timeout: 15
  # Navigate to a series row (TODO: calibrate D-pad to reach series)
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 2
  - wait_state: vod_player
    timeout: 15
  # Play episode
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Trigger next-episode (TODO: calibrate how next-episode UI appears)
  # Typically: DPAD_RIGHT or DOWN to focus next-episode button, then CENTER
  - keyevent: DPAD_RIGHT
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Should still be in player, not remounted to start
  - assert_state: vod_player
