name: login_remembered
# Remember-me-safe login. Fields are prefilled by "Recordarme" on a fresh form,
# so we must NOT type (that doubles user/pass -> 401 authentication_failed).
# Cold-launch renders single stored creds with login_button focused; just submit.
steps:
  - open_app: EpicTV
  - wait_state: login_form
    timeout: 20
  # login_button is focused on the fresh form; submit the prefilled creds.
  - keyevent: DPAD_CENTER
  - wait_state: profile_select
    timeout: 15
