# drive_to_vod — deterministic path to a PLAYING VOD, stop at playback-reached.
# No fault injection. Used as the setup half of the POSITIVE #269 self-heal test
# (STALLED branch): after this passes, the agent cues a human WiFi OFF/ON toggle
# and waits for the 'self-heal on network return (stalled)' log line.
# Oracle is 100% logcat (NO OCR) — player screen is a11y 0-node.
name: drive_to_vod
description: "Cold-boot, login, open a Movie, reach playback (ONLOAD). Stops there."
steps:
  # Auto-login via Recordarme → lands directly on Home. Device prep is one-time
  # preflight (appops REQUEST_INSTALL_PACKAGES allow + screensaver off).
  - reset:
      app: EpicTV
      package: com.epictv
      until_state: home_screen_rail
      timeout: 60
      dismiss_toast: true
  # Sidebar → Movies (label-press; blind D-pad flakes on cold boot).
  - keyevent: DPAD_LEFT       # open sidebar
  - sleep: 3    # sidebar expand animation timing is variable on physical device;
                # `press` taps by ABSOLUTE coords, so a too-early tap lands on the
                # wrong (collapsed-position) item. Verified live 2026-08-03.
  - press: 'label="Movies"'   # --settle waits for the grid to populate
  - sleep: 2
  - keyevent: DPAD_DOWN   # first content row
  - sleep: 1
  - keyevent: DPAD_CENTER # focus title (opens detail)
  - sleep: 1
  # PRIMING PLAY (throwaway): the FIRST <Video> mount after cold-boot on this
  # device silently never fires onLoad (black screen, no onLoad/onError, forever
  # — confirmed live 2026-08-03, 4/4 repro on live TV). The SECOND mount in the
  # same session always works. Root cause looks like a first-mount surface/
  # decoder warmup bug in the app itself, unrelated to #269/#270 — eat one
  # throwaway play+back instead of chasing it.
  - keyevent: DPAD_CENTER # play (priming, throwaway)
  - sleep: 5
  - keyevent: KEYCODE_BACK  # back to detail
  - sleep: 2
  # The priming play often leaves an RN dev LogBox overlay behind (state-update-
  # after-unmount warning from the throwaway mount) that blocks a11y interaction
  # and doesn't reliably close on DPAD_CENTER. Confirmed live 2026-08-03.
  - dismiss_rn_overlay: {}
  - keyevent: DPAD_CENTER # play (real, second mount)
  - sleep: 3
  - dismiss:
      key: DPAD_CENTER
      indicators: ["overlay", "toast", "warning", "error", "logbox"]
      settle: 1
  # Playback-reached gate (NO OCR).
  - wait_log:
      pattern: "ONLOAD|ONREADYFORDISPLAY"
      timeout: 40
      min_s: 2
