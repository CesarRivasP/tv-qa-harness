# S3 — Home
# Preconditions: logged in, any screen
# Steps: sidebar → Home → scroll carousels with D-pad U/D/L/R
name: s3_home
description: "Scroll Home carousels; verify rows render, no blank cards, no focus traps."
steps:
  # Reach sidebar, go to top, then DOWN×2 to Home
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 2
  # Move down through rows
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  # Scroll horizontally within a row
  - keyevent: DPAD_RIGHT
  - sleep: 0.3
  - keyevent: DPAD_RIGHT
  - sleep: 0.3
  - keyevent: DPAD_RIGHT
  - sleep: 0.3
  # Back to top row
  - keyevent: DPAD_UP
  - sleep: 0.5
  - keyevent: DPAD_UP
  - sleep: 0.5
  - keyevent: DPAD_UP
  - sleep: 0.5
  # Assert still on home
  - assert_state: home_screen_rail
