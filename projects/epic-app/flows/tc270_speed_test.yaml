# #270 — Speed test rejects fast-erroring proxies
# Goal: measureDownloadSpeed scores a fast-erroring (up-but-502) proxy 0, not high.
# Harness: vodswap + EPIC_TARGET_SPEED_FAIL=502 (degrades proxy with 502, healthy get 200).
# Reference: e2e_test_suite.md §#270
name: tc270_speed_test
description: "VOD with vodswap+502; verify speed test picks healthy proxy (changed:true), playback recovers."
steps:
  # Preconditions (performed by human before run):
  #   - App is foregrounded on home_screen_rail (already logged-in & profile selected).
  #   - No overlay/modal is present.
  - reset:
      app: EpicTV
      package: com.epictv
      until_state: home_screen_rail
      timeout: 60
      dismiss_toast: true
  # Navigate via sidebar to Movies (label-press; blind D-pad flakes on cold boot).
  - keyevent: DPAD_LEFT       # open sidebar
  - sleep: 3    # sidebar expand animation timing is variable on physical device;
                # `press` taps by ABSOLUTE coords, so a too-early tap lands on the
                # wrong (collapsed-position) item. Verified live 2026-08-03.
  - press: 'label="Movies"'   # --settle waits for the grid to populate
  - sleep: 2
  - keyevent: DPAD_DOWN   # first content row
  - sleep: 1
  - keyevent: DPAD_CENTER # focus title (opens detail)
  - sleep: 1
  # PRIMING PLAY (throwaway): the FIRST <Video> mount after cold-boot on this
  # device silently never fires onLoad (black screen, no onLoad/onError, forever
  # — confirmed live 2026-08-03, 4/4 repro on live TV). The SECOND mount in the
  # same session always works. Root cause looks like a first-mount surface/
  # decoder warmup bug in the app itself, unrelated to #269/#270 — eat one
  # throwaway play+back instead of chasing it.
  - keyevent: DPAD_CENTER # play (priming, throwaway)
  - sleep: 5
  - keyevent: KEYCODE_BACK  # back to detail
  - sleep: 2
  # The priming play often leaves an RN dev LogBox overlay behind (state-update-
  # after-unmount warning from the throwaway mount) that blocks a11y interaction
  # and doesn't reliably close on DPAD_CENTER. Confirmed live 2026-08-03.
  - dismiss_rn_overlay: {}
  - keyevent: DPAD_CENTER # play (real, second mount)
  - sleep: 3
  # Playback-reached gate (NO OCR). proxySpeedTest.ts has NO logger calls, so the
  # speed test itself is invisible in logcat — we gate on onLoad instead.
  - wait_log:
      pattern: "ONLOAD|ONREADYFORDISPLAY"
      timeout: 40
      min_s: 2
  - sleep: 5
  - dismiss:
      key: DPAD_CENTER
      indicators: ["overlay", "toast", "warning", "error", "logbox"]
      settle: 1
  # Start proxy: target gets 502 on test URL, healthy proxies get synthetic 200.
  # vodswap defaults: EPIC_TARGET_PROXY=proxy2, EPIC_TARGET_SPEED_FAIL=502.
  - proxy: {mode: vodswap}
  # SWAP ORACLE (NO OCR): the only logcat-visible consequence of a winning swap is
  # attemptProxySwap → handleReloadVideo({reason: proxy}) → useReloadPlayer logs
  # HANDLERELOADVIDEO. NOTE: the swap only triggers if playback actually buffers
  # past EXCESSIVE_BUFFERING_MS; vodswap degrades the speed-test URL, not neces-
  # sarily the CDN stream, so this flow may need the stream itself throttled to
  # force buffering. #270 is already device-verified (2026-07-14); this is regression.
  - wait_log:
      pattern: "HANDLERELOADVIDEO"
      timeout: 60
      min_s: 5
  - proxy_stop: {}
