# S2 — Profiles
# Preconditions: logged in, on Home (or any screen with sidebar)
# Steps: sidebar → Switch profiles → select adult → verify home → relaunch → select kids
name: s2_profiles
description: "Select adult profile, then relaunch and select Kids profile, verify gating."
steps:
  # Reach sidebar, navigate UP×2 to Switch profiles, click it
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - wait_state: profile_select
    timeout: 15
  # Select adult profile (first item, currently focused)
  - keyevent: DPAD_CENTER
  - wait_state: home_screen_rail
    timeout: 15
  - assert_state: home_screen_rail
  # Relaunch app (goes to Home because profile is remembered)
  - keyevent: HOME
  - sleep: 2
  - open_app: EpicTV
  - wait_state: home_screen_rail
    timeout: 15
  # Return to profile_select via sidebar
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - wait_state: profile_select
    timeout: 15
  # Navigate to Kids profile (second item)
  - keyevent: DPAD_RIGHT
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - wait_state: home_screen_rail
    timeout: 15
  - assert_state: home_screen_rail
