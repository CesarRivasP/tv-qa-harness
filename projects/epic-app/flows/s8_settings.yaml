# S8 — Settings
# Preconditions: logged in, any screen
# Steps: sidebar → Settings → navigate submenus → verify no clipping
name: s8_settings
description: "Navigate Settings root and submenus; verify navigable and no clipping."
steps:
  # Sidebar: LEFT×10 → UP×10 → DOWN×9 to Settings
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 2
  - wait_state: settings_root
    timeout: 15
  # Navigate into first submenu (e.g., Profile image)
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 2
  # Submenu opened (overlay); parent settings still visible
  - assert_state: settings_root
  # Back to settings root
  - keyevent: BACK
  - sleep: 1
  - assert_state: settings_root
