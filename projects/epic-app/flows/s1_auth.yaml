# S1 — Auth (auto-login with Recordarme)
# Preconditions: app has active session with Recordarme checked
# agent-device open preserves session → lands on profile_select directly.
# For manual login test, run s10_logout first, then use login_form steps.
name: s1_auth
description: "Verify app opens and auto-authenticates to profile selection via Recordarme."
steps:
  - open_app: EpicTV
  - wait_state: profile_select
    timeout: 15
