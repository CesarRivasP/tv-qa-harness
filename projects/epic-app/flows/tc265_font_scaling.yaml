# #265 — fontSize dp → Style.px sweep
# Goal: text scales proportionally on sub-1080p panels (no oversize/clipping).
# This is a visual / density-matrix test; the harness changes wm density then
# verifies that key screens still pass their state checks without clipping.
# Reference: e2e_test_suite.md §#265
name: tc265_font_scaling
description: "Visual smoke: verify screens render correctly at 720p-equivalent density."
steps:
  # Set sub-1080p density (320 = 720p-equivalent on this AVD)
  - shell: "adb shell wm density 320"
  - sleep: 2
  # S1: Auth screen at 720p
  - open_app: EpicTV
  - wait_state: login_form
    timeout: 20
  - assert_state: login_form
  # Login and reach home
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_CENTER
  - sleep: 1
  - type: "$TVQA_USERNAME"
  - keyevent: 66
  - sleep: 1
  - keyevent: DPAD_CENTER
  - sleep: 1
  - type: "$TVQA_PASSWORD"
  - keyevent: 66
  - sleep: 1
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_CENTER
  - wait_state: profile_select
    timeout: 15
  - keyevent: DPAD_CENTER
  - wait_state: home_screen_rail
    timeout: 15
  # S3: Home carousels at 720p — specific check: Top 10 numbers 1-10 visible
  - assert_state: home_screen_rail
  # Reset density back to 1080p default (160)
  - shell: "adb shell wm density 160"
  - sleep: 2
