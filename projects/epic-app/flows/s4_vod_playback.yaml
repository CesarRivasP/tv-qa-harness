# S4 — VOD playback
# Preconditions: logged in, any screen
# Steps: sidebar → Movies → open title → Resume → play → pause → seek → resume
name: s4_vod_playback
description: "Open a VOD title from Movies, resume, play, pause, seek, verify position preserved."
steps:
  # Sidebar → Movies (from Home-focused sidebar, DOWN×2)
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 2
  # In Movies, navigate down to a content row and select first title
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_DOWN
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 2
  # Expect player or episode list
  - wait_state: vod_player
    timeout: 15
  # Play/resume
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Pause
  - keyevent: DPAD_CENTER
  - sleep: 1
  # Seek forward with RIGHT
  - keyevent: DPAD_RIGHT
  - sleep: 0.5
  - keyevent: DPAD_RIGHT
  - sleep: 0.5
  # Resume
  - keyevent: DPAD_CENTER
  - sleep: 2
  # Back to home
  - keyevent: BACK
  - sleep: 1
  - assert_state: home_screen_rail
