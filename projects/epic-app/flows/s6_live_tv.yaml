# S6 — Live TV
# Preconditions: logged in, any screen
# Steps: sidebar → Live TV → open channel → zap → toggle favorite
name: s6_live_tv
description: "Navigate to Live TV, open a channel, zap to another, toggle favorite."
steps:
  # Sidebar: LEFT×10 → UP×10 → DOWN×6 to Live TV
  - shell: "input keyevent 21 21 21 21 21 21 21 21 21 21"
  - sleep: 0.5
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - keyevent: DPAD_DOWN
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 5
  # Live TV may have poor a11y during load; skip strict state check
  # - wait_state: live_tv_grid
  #   timeout: 15
  # Open first channel
  - keyevent: DPAD_CENTER
  - sleep: 5
  # Zap to next channel
  - keyevent: DPAD_RIGHT
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Toggle favorite (TODO: calibrate favorite button location)
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 1
  # Back to grid
  - keyevent: BACK
  - sleep: 1
