# S6 — Live TV
# Preconditions: logged in, at home
# Steps: Live grid → open channel → zap → toggle favorite → verify focus and playback
name: s6_live_tv
description: "Navigate to Live TV, open a channel, zap to another, toggle favorite."
steps:
  - wait_state: home_screen_rail
    timeout: 15
  # Navigate to Live TV tab/row (TODO: calibrate from home rail)
  - keyevent: DPAD_RIGHT  # TODO(calibrate): reach Live TV menu item
  - keyevent: DPAD_RIGHT
  - keyevent: DPAD_CENTER
  - sleep: 2
  - wait_state: live_tv_grid
    timeout: 15
  # Open first channel
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Zap to next channel
  - keyevent: DPAD_RIGHT
  - sleep: 0.5
  - keyevent: DPAD_CENTER
  - sleep: 3
  # Toggle favorite (TODO: calibrate favorite button location)
  - keyevent: DPAD_UP
  - sleep: 0.3
  - keyevent: DPAD_CENTER
  - sleep: 1
  # Back to grid
  - keyevent: BACK
  - sleep: 1
  - assert_state: live_tv_grid
